<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172e2a">
<title>午餐雷達｜公司附近美食地圖</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172e2a;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#17332e;color:#fff;padding:26px max(20px,calc((100vw - 1200px)/2));}header .eyebrow{font-size:12px;color:#c5e9d0;letter-spacing:2px}header h1{font-size:clamp(26px,4vw,42px);margin:8px 0}header p{margin:4px 0;color:#cfe0d9}main{max-width:1200px;padding:24px 20px 70px;margin:auto}.toolbar{display:grid;grid-template-columns:1.3fr 1fr auto;gap:12px;margin-bottom:14px}input,select,textarea{border:1px solid #d2dbd3;border-radius:12px;background:white;padding:12px;width:100%;outline-color:#497e66}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 20px}.pill{background:#fff;border:1px solid #d7e0d7;padding:8px 14px;border-radius:40px;color:#456057}.pill.active{background:#173f34;color:white;border-color:#173f34}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.82fr);gap:18px;align-items:start}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid #e3e8e2;border-radius:17px;padding:17px;box-shadow:0 3px 13px #223a300b;display:flex;flex-direction:column;gap:10px}.category{font-size:12px;color:#567b68;font-weight:700}.card h2{margin:0;font-size:18px}.meta{font-size:13px;color:#66756e;line-height:1.6}.comment{background:#f2f7ef;padding:10px;border-radius:10px;font-size:14px;color:#385646;flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#19493c;color:white;border:none;border-radius:10px;padding:9px 12px;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;font-size:13px}.btn.secondary{background:#e8f0e9;color:#214d3e}.btn.outline{background:#fff;color:#214d3e;border:1px solid #cadacf}.mapbox{position:sticky;top:14px;background:white;padding:14px;border:1px solid #e2e8e2;border-radius:18px}.mapbox h2{font-size:19px;margin:4px 0 6px}.mapbox p{font-size:13px;color:#63756b;margin:0 0 12px}.mapbox iframe{border:0;border-radius:12px;width:100%;height:490px;background:#e8eee7}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{color:#63766a;font-size:14px}.note{font-size:12px;color:#78857e;line-height:1.7;margin-top:12px}.empty{padding:40px;background:white;border-radius:16px;color:#66806c}.toolbar .btn{white-space:nowrap}.flag{display:inline-block;color:#427151;background:#eaf5eb;border-radius:50px;font-size:11px;padding:4px 8px}.modal{position:fixed;inset:0;background:#122b24b3;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{width:min(100%,510px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:24px}.dialog h2{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.dialogfooter{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}.stats{display:flex;gap:16px;font-size:13px;color:#cadecf;margin-top:12px}.stats b{color:white;font-size:20px}.subnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hide{display:none} @media(max-width:930px){.layout{grid-template-columns:1fr}.mapbox{position:static;order:-1}.mapbox iframe{height:300px}} @media(max-width:560px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.cards{grid-template-columns:1fr}main{padding:14px 12px 50px}header{padding:24px 16px}.mapbox iframe{height:250px}}
</style>
</head>
<body>
<header><div class="eyebrow">LUNCH RADAR · TAIPEI</div><h1>今天午餐吃什麼？</h1><p>南京復興周邊・我的口袋美食地圖</p><div class="stats"><span><b id="total">12</b> 家收藏</span><span><b id="visible">12</b> 家符合篩選</span><span>✓ 全部吃過</span></div></header>
<main><div class="toolbar"><input id="search" placeholder="搜尋店名、料理、地址、我的評語…" aria-label="搜尋"><select id="sort" aria-label="排序"><option value="default">原始收藏順序</option><option value="name">店名排序</option><option value="category">料理分類排序</option></select><button class="btn secondary" id="add">＋ 新增餐廳</button></div><div class="headrow"><div class="subnav" id="tabs"></div><div class="count" id="counts"></div></div><div class="layout"><section id="cards" class="cards"></section><aside class="mapbox"><h2 id="maptitle">🗺️ 美食位置</h2><p id="mapdesc">點擊左方「地圖預覽」，即可切換到店家位置。</p><iframe id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="餐廳地圖"></iframe><div class="actions" style="margin-top:12px"><a class="btn" id="maplink" href="https://www.google.com/maps/search/?api=1&query=%E5%8D%97%E4%BA%AC%E5%BE%A9%E8%88%88%E7%AB%99" target="_blank" rel="noopener">Google Maps 開啟位置 ↗</a><button class="btn secondary" id="restore">還原原始 12 家</button></div><div class="note">資料以原 Canva 清單與個人更新為基礎。店家營業狀態會變動，出發前請查詢當日營業時間。本頁可離線瀏覽餐廳資料；地圖預覽需連網。新增或修改店家會保存在目前瀏覽器，並不會同步至其他裝置。</div></aside></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="dialog"><h2 id="dialogtitle">新增餐廳</h2><form id="foodform"><input type="hidden" name="id"><div class="field"><label>店家名稱 *</label><input name="name" required maxlength="100"></div><div class="field"><label>料理類型</label><select name="category"><option>中式麵飯</option><option>健康餐盒</option><option>日式料理</option><option>韓式料理</option><option>義式料理</option><option>早午餐</option><option>其他</option></select></div><div class="field"><label>推薦餐點</label><input name="dishes" maxlength="160"></div><div class="field"><label>地址</label><input name="address" maxlength="180" placeholder="台北市…"></div><div class="field"><label>我的評語</label><textarea name="note" rows="3" maxlength="500"></textarea></div><div class="dialogfooter"><button type="button" class="btn outline" id="cancel">取消</button><button class="btn" type="submit">儲存餐廳</button></div></form></div></div>
<script>
const initial=[
{id:1,name:'碰麵麵食館（南京店）',category:'中式麵飯',dishes:'炒飯、乾麵',address:'台北市松山區南京東路三段256巷28弄1號',note:'好吃炒飯，好吃乾麵'},
{id:2,name:'汆食光（原汆食堂）',category:'健康餐盒',dishes:'水煮健康餐盒',address:'台北市中山區南京東路三段216巷21號',note:'水煮健康餐盒；店名可能已更新'},
{id:3,name:'GET POWER 給力盒子',category:'健康餐盒',dishes:'水煮健康餐盒',address:'台北市松山區八德路二段366巷12號',note:'水煮健康餐盒'},
{id:4,name:'多田壽司屋',category:'日式料理',dishes:'生魚片、丼飯',address:'台北市中山區南京東路三段216巷6號',note:'好吃生魚片，好吃丼飯'},
{id:5,name:'四鄉五島馬祖麵店',category:'中式麵飯',dishes:'馬祖麵食',address:'台北市中山區遼寧街7號',note:'24小時的好滋味（舊評語，營業時段需另查）'},
{id:6,name:'馬祖麵館（南京店）',category:'中式麵飯',dishes:'大餛飩',address:'台北市中山區南京東路三段216巷7號',note:'大餛飩'},
{id:7,name:'野毛洋食屋',category:'日式料理',dishes:'日式咖哩、漢堡排、義大利麵',address:'台北市中山區八德路二段327號1樓',note:'日式咖哩（3種）、漢堡排、義大利麵'},
{id:8,name:'Cin Cin Osteria 請請義大利餐廳（慶城店）',category:'義式料理',dishes:'義大利麵、燉飯',address:'台北市松山區慶城街16巷16號1樓',note:'ELLIE 餐盤推薦'},
{id:9,name:'就是這間－功夫牛肉麵',category:'中式麵飯',dishes:'牛肉麵',address:'台北市松山區八德路二段366巷29號1樓',note:'好吃牛肉麵'},
{id:10,name:'蘭芳麵食館',category:'中式麵飯',dishes:'花椒麵、滷味',address:'台北市中山區遼寧街95號',note:'花椒麵、滷味；已吃過'},
{id:11,name:'醬吃 Brunch',category:'早午餐',dishes:'早餐、早午餐',address:'台北市中山區朱崙街77號',note:'公司附近最好吃早餐店；已吃過'},
{id:12,name:'金春喜韓廚－台北長一店',category:'韓式料理',dishes:'韓式豬肉湯飯、牛肉湯飯、韓式小菜',address:'台北市中山區長安東路二段174-1號',note:'好吃'}];
const STORE='andys-foodmap-v1';let foods;try{foods=JSON.parse(localStorage.getItem(STORE))||initial.map(x=>({...x}));if(!Array.isArray(foods))throw Error()}catch(e){foods=initial.map(x=>({...x}))}let category='全部';let chosen=null;const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(STORE,JSON.stringify(foods))}catch(e){alert('無法在此瀏覽器保存資料，請檢查隱私設定。')}}const google=f=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((f.address||'台北市')+' '+f.name);function setMap(f){chosen=f;const q=(f?f.address+' '+f.name:'台北市南京復興站');$('maptitle').textContent=f?'📍 '+f.name:'🗺️ 南京復興周邊';$('mapdesc').textContent=f?(f.address||'點擊開啟地圖'):'點擊餐廳的「地圖預覽」，查看店家所在區域。';$('map').src='https://maps.google.com/maps?output=embed&q='+encodeURIComponent(q);$('maplink').href=f?google(f):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function render(){const cats=['全部',...new Set(foods.map(x=>x.category))];$('tabs').innerHTML=cats.map(c=>`<button class="pill ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');const q=$('search').value.trim().toLocaleLowerCase();let list=foods.filter(x=>(category==='全部'||x.category===category)&&[x.name,x.dishes,x.address,x.note,x.category].join(' ').toLocaleLowerCase().includes(q));if($('sort').value==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));if($('sort').value==='category')list.sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant'));$('total').textContent=foods.length;$('visible').textContent=list.length;$('counts').textContent=`顯示 ${list.length} 家`;$('cards').innerHTML=list.length?list.map(f=>`<article class="card"><div class="category">${esc(f.category)} <span class="flag">✓ 已吃過</span></div><h2>${esc(f.name)}</h2><div class="meta">🍽 ${esc(f.dishes||'餐點待補')}<br>📍 ${esc(f.address||'地址待補')}</div><div class="comment">「${esc(f.note||'尚未填寫評語')}」</div><div class="actions"><button class="btn" data-map="${esc(f.id)}">地圖預覽</button><a class="btn secondary" target="_blank" rel="noopener" href="${esc(google(f))}">導航 ↗</a><button class="btn outline" data-edit="${esc(f.id)}">編輯</button></div></article>`).join(''):'<div class="empty">找不到符合條件的餐廳，試試其他搜尋詞。</div>'}function openForm(f){$('foodform').reset();$('foodform').elements.id.value=f?.id??'';['name','category','dishes','address','note'].forEach(k=>{if(f)$('foodform').elements[k].value=f[k]||''});$('dialogtitle').textContent=f?'編輯餐廳':'新增餐廳';$('modal').classList.add('show')}$('tabs').addEventListener('click',e=>{const el=e.target.closest('[data-cat]');if(el){category=el.dataset.cat;render()}});$('cards').addEventListener('click',e=>{const a=e.target.closest('[data-map]'),b=e.target.closest('[data-edit]');if(a){const f=foods.find(x=>String(x.id)===a.dataset.map);if(f){setMap(f);if(window.innerWidth<930)$('map').scrollIntoView({behavior:'smooth',block:'center'})}}if(b){const f=foods.find(x=>String(x.id)===b.dataset.edit);if(f)openForm(f)}});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('add').onclick=()=>openForm();$('cancel').onclick=()=> $('modal').classList.remove('show');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show')});$('foodform').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),id=fd.get('id');const item={id:id||String(Date.now()),name:String(fd.get('name')).trim(),category:fd.get('category'),dishes:String(fd.get('dishes')).trim(),address:String(fd.get('address')).trim(),note:String(fd.get('note')).trim()};if(!item.name)return;const i=foods.findIndex(x=>String(x.id)===String(id));if(i>=0)foods[i]=item;else foods.push(item);persist();category='全部';$('search').value='';render();setMap(item);$('modal').classList.remove('show')});$('restore').onclick=()=>{if(confirm('確定要還原到最初的12間餐廳？這會清除你在此瀏覽器新增或編輯的資料。')){foods=initial.map(x=>({...x}));persist();category='全部';$('search').value='';render();setMap(null)}};render();setMap(null);
</script></body></html>
